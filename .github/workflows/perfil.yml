name: Actualizar perfil

# Genera la culebrita, la racha y los lenguajes y los publica en la rama "output".
on:
  schedule:
    - cron: "17 5 * * *"   # todos los días a la 1:17 a. m. de Caracas
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/perfil.yml"

permissions:
  contents: write

concurrency:
  group: perfil
  cancel-in-progress: true

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Culebrita
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light
            dist/snake-dark.svg?palette=github-dark&color_snake=#00E5A0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Racha y lenguajes
        run: node scripts/stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          OUT_DIR: dist

      - name: Publicar en la rama output
        run: |
          cd dist
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Actualizar imágenes del perfil"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output
